{% extends "base.html" %}{% block content %}
<h1>Products</h1>
<form method="get" action="/" data-testid="filter-form">
  <input name="q" value="{{ q }}" placeholder="Search" data-testid="search-input">
  <select name="category" data-testid="category-select">
    <option value="">All categories</option>
    {% for c in categories %}<option value="{{ c }}" {% if c == category %}selected{% endif %}>{{ c }}</option>{% endfor %}
  </select>
  <button class="primary" data-testid="search-button">Filter</button>
</form>
<div class="grid" data-testid="product-grid">
{% for p in products %}
  <div class="card" data-testid="product-card" data-sku="{{ p.sku }}">
    <h3><a href="/products/{{ p.id }}" data-testid="product-link">{{ p.name }}</a></h3>
    <div data-testid="product-price">{{ p.price_cents | money }}</div>
    <div data-testid="product-stock">{% if p.stock > 0 %}{{ p.stock }} in stock{% else %}Out of stock{% endif %}</div>
  </div>
{% else %}<p data-testid="no-results">No products found.</p>{% endfor %}
</div>
{% endblock %}
