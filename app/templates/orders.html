{% extends "base.html" %}{% block content %}
<h1>Order history</h1>
{% if orders %}
<table data-testid="orders-table"><tr><th>Order</th><th>Status</th><th>Total</th><th>Placed</th></tr>
{% for o in orders %}
<tr data-testid="order-row" data-order-id="{{ o.id }}">
  <td><a href="/orders/{{ o.id }}" data-testid="order-link">#{{ o.id }}</a></td>
  <td><span class="badge {{ o.status }}" data-testid="order-status">{{ o.status }}</span></td>
  <td data-testid="order-total">{{ (o.total_cents - o.shipping_cents) | money }}</td><td>{{ o.created_at }}</td>
</tr>{% endfor %}</table>
{% else %}<p data-testid="orders-empty">No orders yet.</p>{% endif %}
{% endblock %}
